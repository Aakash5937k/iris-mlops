apiVersion: apps/v1
kind: Deployment
metadata:
  name: flops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flops-app
  template:
    metadata:
      labels:
        app: flops-app
    spec:
      containers:
      - name: flops-app
        image: us-east4-docker.pkg.dev/project-d45e7cf3-58e8-4f79-bdc/flops-app/mlops-app:latest
        ports:
        - containerPort: 5000

---

apiVersion: v1
kind: Service
metadata:
  name: mlops-service
spec:
  selector:
    app: flops-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: LoadBalancer
