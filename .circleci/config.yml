version: 2.1

executors:
  docker-executor:
    docker:
      - image: google/cloud-sdk:latest
    working_directory: ~/repo

jobs:
  checkout_code:
    executor: docker-executor
    steps:
      - checkout

  build_docker_image:
    executor: docker-executor
    steps:
      - checkout
      - setup_remote_docker

      - run:
        name: Check Environment
        command: |
          echo "========== Docker =========="
          which docker || echo "Docker CLI not found"
          docker --version || echo "Docker version unavailable"

          echo "========== Google Cloud =========="
          which gcloud || echo "gcloud not found"
          gcloud --version || echo "gcloud unavailable"

          echo "========== Kubernetes =========="
          which kubectl || echo "kubectl not found"
          kubectl version --client || echo "kubectl unavailable"

      echo "========== Environment Check Completed =========="
      - run:
          name: Authenticate with google cloud
          command: |
              echo "$GCLOUD_SERVICE_KEY" | base64 --decode > gcp-key.json
              gcloud auth activate-service-account --key-file=gcp-key.json
              gcloud auth configure-docker us-east4-docker.pkg.dev || gcloud auth configure-docker

      - run:
          name: Build and Push Image
          command: |
              docker build -t us-east4-docker.pkg.dev/$GOOGLE_PROJECT_ID/flops-app/flops-app:latest .
              docker push us-east4-docker.pkg.dev/$GOOGLE_PROJECT_ID/flops-app/flops-app:latest

  deploy_to_gke:
    executor: docker-executor
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Authenticate with google cloud
          command: |
              echo "$GCLOUD_SERVICE_KEY" | base64 --decode > gcp-key.json
              gcloud auth activate-service-account --key-file=gcp-key.json
              gcloud auth configure-docker us-east4-docker.pkg.dev || gcloud auth configure-docker
      
      - run:
          name: Configure GKE
          command: |
              gcloud container clusters get-credentials $GKE_CLUSTER --region $GOOGLE_COMPUTE_REGION --project $GOOGLE_PROJECT_ID
      - run:
          name: Deploy to GKE
          command: |
              kubectl apply -f kubernetes-deployment.yaml

workflows:
  version: 2
  deploy_pipeline:
    jobs:
      - checkout_code
      - build_docker_image:
          requires:
            - checkout_code
      - deploy_to_gke:
          requires:
            - build_docker_image

    





